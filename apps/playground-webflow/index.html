<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shadermix — Webflow playground</title>
    <style>
      body {
        margin: 0;
        background: #0a0a0b;
        color: #f5f5f5;
        font-family: system-ui, sans-serif;
      }
      .hero {
        position: relative;
        min-height: 60vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .sm-content {
        position: relative;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <!--
      Mimics a Webflow "Footer code" install (plan §7.1) and a section with an
      sm-effect attribute (plan §7.2). No effects exist yet (land in M1/M2) —
      this page exists so the webflow bundle can be smoke-tested as it grows.
    -->
    <section class="hero" sm-effect="aurora">
      <div class="sm-content">
        <h1>Shadermix × Webflow playground</h1>
      </div>
    </section>

    <script src="../../packages/webflow/dist/shadermix.min.js" defer></script>
  </body>
</html>
